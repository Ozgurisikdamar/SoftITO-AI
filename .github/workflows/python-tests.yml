name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest scikit-learn
      - name: Run unit tests
        run: pytest -q
      - name: Compile Python examples
        run: python -m compileall -q "Big Data" "ETL-ELT" NLP tests
      - name: Smoke-test NLP classifier
        run: python NLP/tfidf_classifier.py
